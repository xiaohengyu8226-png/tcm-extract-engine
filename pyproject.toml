[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcm-extract-engine"
version = "0.1.0"
description = "中医自动化抽取与自反馈自优化引擎（C/A/B + GEPA 飞轮）"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "pydantic>=2.7",
]

[project.scripts]
tcm-engine = "tcm_extract_engine.cli:app"

[project.optional-dependencies]
mineru = ["mineru[all]==3.4.4"]
export = ["openpyxl>=3.1"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "pyright>=1.1", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/tcm_extract_engine"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["E501", "ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["tcm_extract_engine"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
